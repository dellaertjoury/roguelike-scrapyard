<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ottokeirkhof</title>
<meta name="description" content="Ne low-poly drift-en-crash roguelike in 't West-Vlams. Glisseer om je geweren warm te stoken, ram ze kassé en bouw je oto tusschen de toeren.">
<meta property="og:title" content="Ottokeirkhof">
<meta property="og:description" content="Glisseer, ram ze kassé en bouw je brol-oto tusschen de toeren.">
<meta property="og:image" content="https://dellaertjoury.github.io/roguelike-scrapyard/assets/og.jpg">
<meta property="og:url" content="https://dellaertjoury.github.io/roguelike-scrapyard/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sunny, toy-like, low-poly racing; clean glassy HUD panels
   IDEA: a dirt derby arena seen from a TV camera crane, a workshop blueprint between laps
   PICTURE: the live 3D arena fills the screen
   COLOUR and TYPE: grass green world, charcoal glass panels, rust orange + hazard yellow accents; Rubik + Inter
   LAYOUT: full-screen canvas, HUD in the four corners, overlays centred */
:root{color-scheme:dark;--glass:rgba(34,36,40,.8);--glass2:rgba(48,50,56,.9);--ink:#fff;--mute:#c3c7cf;--rust:#e8553a;--haz:#ffc23d;--nitro:#5fc8f0;--line:rgba(255,255,255,.12);--bp:#8fd0ea}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#9fcf7e;color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;user-select:none}
#gl{position:absolute;inset:0}#gl canvas{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1} /* above the HUD so edge arrows are never hidden */
#fx div{position:absolute;left:0;top:0;display:none;font:700 16px Inter,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap}
.hide{display:none!important}
.lbl{font:700 11px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.uico{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:6px}

/* loading screen */
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px;text-align:center;
  background:url(assets/loading-bg.jpg) center/cover,url(assets/menu-bg.jpg) center/cover,#24262b;transition:opacity .5s}
#loading::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(24,26,30,.55),rgba(24,26,30,.85))}
#loading.done{opacity:0;pointer-events:none}
.ld{position:relative;display:grid;justify-items:center;gap:18px;width:min(560px,100%)}
.ld img.lg{max-width:min(520px,100%);max-height:30vh;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.ld .tyre{width:68px;height:68px;border-radius:50%;border:9px dashed #141312;background:radial-gradient(circle,#c9ccd2 0 18%,#2a2826 19% 54%,#e24a32 55% 62%,#2a2826 63%);box-shadow:0 0 0 3px #2a2826,0 6px 0 rgba(0,0,0,.3);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.track{width:100%;height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.track i{display:block;height:100%;width:4%;background:repeating-linear-gradient(-45deg,var(--haz) 0 10px,#e8a92a 10px 20px);border-radius:8px;transition:width .2s}
#loadMsg{font:800 22px Rubik,sans-serif}#loadTip{color:var(--mute);min-height:3em;max-width:46ch}
#loadPct{font:600 13px Inter,sans-serif;color:var(--mute)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.pnl{position:absolute;background:var(--glass);backdrop-filter:blur(6px);border-radius:14px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tl{left:16px;top:16px;width:min(300px,40vw)}
/* riveted steel plates for the top HUD: gunmetal gradient, a bolt in each corner, a hazard stripe along one edge */
.plate{position:absolute;padding:12px 14px 12px 18px;border-radius:12px;background:linear-gradient(160deg,#4a4844,#2b2a27 55%,#232220);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.4),0 0 0 2px #1a1917,0 10px 24px rgba(0,0,0,.35);display:grid;gap:10px}
.plate::before{content:"";position:absolute;inset:6px;pointer-events:none;background:radial-gradient(circle,#9a968e 0 2.2px,#3a3835 2.6px,transparent 3.4px) 0 0/100% 100% no-repeat,radial-gradient(circle at 3px 3px,#9a968e 0 2.2px,#3a3835 2.6px,transparent 3.4px) left top/7px 7px no-repeat,radial-gradient(circle at 3px 3px,#9a968e 0 2.2px,#3a3835 2.6px,transparent 3.4px) right top/7px 7px no-repeat,radial-gradient(circle at 3px 3px,#9a968e 0 2.2px,#3a3835 2.6px,transparent 3.4px) left bottom/7px 7px no-repeat,radial-gradient(circle at 3px 3px,#9a968e 0 2.2px,#3a3835 2.6px,transparent 3.4px) right bottom/7px 7px no-repeat}
.plate::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(-45deg,#ffc23d 0 6px,#1a1917 6px 12px)}
.plate .row{display:flex;align-items:center;gap:10px}.plate .col{flex:1;display:grid;gap:4px;min-width:0}
.badge{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#5a5752,#1f1e1c);box-shadow:0 0 0 2px #e8553a,inset 0 2px 4px rgba(0,0,0,.6)}
.badge.sm{width:30px;height:30px;box-shadow:0 0 0 2px #ffc23d,inset 0 2px 4px rgba(0,0,0,.6)}
.badge img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.plate .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:800 11px Rubik,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#d9d3c4;white-space:nowrap}
.plate .hd .val{font:800 15px Rubik,sans-serif;letter-spacing:0;color:#fff;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.plate .hd .chip{font:700 10.5px Inter,sans-serif;color:#ffc23d;letter-spacing:.02em}
/* segmented bars: a 10-cell grille over the fill */
.seg{position:relative;height:14px;border-radius:4px;background:#121110;box-shadow:inset 0 2px 3px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);overflow:hidden}
.seg.heat{height:9px}
.seg i{position:absolute;inset:0 auto 0 0;width:0;transition:width .12s;background:linear-gradient(180deg,#ff8a5a,#e8553a 55%,#b83a22)}
.seg.heat i{background:linear-gradient(90deg,#ffd45a,#ff9a2a 55%,#ff3b2a)}
.seg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#121110 calc(10% - 2px) 10%)}
.seg i.low{background:linear-gradient(180deg,#ff6a5a,#ff2a1a);animation:blink .5s steps(2) infinite}
#hullPlate.hit{animation:shakeP .3s}
@keyframes shakeP{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.meter{position:relative;height:18px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.meter.sm{height:12px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--rust);border-radius:6px;transition:width .1s}
.meter i.low{background:#ff3b30}
.meter.nitro i{background:var(--nitro)}.meter.nitro i.on{background:#bdf0ff}
.meter.heat i{background:var(--haz)}
.meter span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font:700 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.meter.sm span{font-size:10px}
/* gauge cluster, bottom-left: SVG built in ui.js; optional art in assets/ui/cluster-*.png and fuel-gauge.png */
#cluster{position:absolute;left:10px;bottom:8px;width:clamp(250px,26vw,350px);aspect-ratio:360/250;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
#cluster svg{display:block;width:100%;height:100%;overflow:visible}
#cluster text{font-family:Rubik,Inter,sans-serif;font-weight:800}
#cluster .lcd{font-family:Inter,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
#cluster .fuelL{transition:fill .2s}
#cluster.low .fuelL{fill:#ff5a4a;animation:blink .6s steps(2) infinite}
#cluster.low .fuelRing{stroke:#e24a32;opacity:1;animation:blink .6s steps(2) infinite}
#cluster.filling .fuelL{fill:#7fdcaa}#cluster.filling .fuelRing{stroke:#7fdcaa;opacity:1}
#cluster .fuelRing{opacity:0}
#cluster .led{transition:fill .08s}
#cluster.boost .nosGlow{opacity:1}#cluster .nosGlow{opacity:0;transition:opacity .15s}
#cluster.boost .sNeedle{fill:#bdf0ff}
#cluster.shift .gearBox{animation:gear .9s ease-out}
@keyframes gear{0%{fill:#ffc23d}100%{fill:#15130f}}
@keyframes blink{50%{opacity:.35}}
#bossPnl{left:50%;top:16px;transform:translateX(-50%);width:min(440px,70vw);display:grid;gap:6px}
#bossPnl .meter i{background:#e0b040}
.tr{right:16px;top:16px;grid-auto-flow:column;align-items:center;gap:12px;padding:10px 18px 10px 22px}
.sico{width:64px;height:64px;display:grid;place-items:center;border-radius:14px;background:radial-gradient(circle at 40% 35%,rgba(255,194,61,.35),rgba(255,194,61,0) 70%)}
.sico img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.lbl2{font:800 11px Rubik,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#d9d3c4}
.snum{font:800 clamp(30px,3.6vw,42px)/1 Rubik,sans-serif;color:#ffc23d;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #7a4a10,0 0 18px rgba(255,194,61,.35);transition:transform .15s}
.snum.pop{transform:scale(1.18)}
.wrk{font:600 12px Inter,sans-serif;color:#c3c7cf}
.bump{position:absolute;right:14px;top:-6px;font:800 18px Rubik,sans-serif;color:#7fdcaa;text-shadow:0 2px 0 rgba(0,0,0,.5);opacity:0;pointer-events:none}
.bump.go{animation:bumpUp .9s ease-out}
@keyframes bumpUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.num{font:600 clamp(26px,3.4vw,36px)/1.1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
.small{color:var(--mute);font-size:13px}
.ang{color:var(--rust);font:600 18px Inter,sans-serif}
.big{font:600 clamp(44px,6vw,64px)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.big small,.num small{font:700 12px Inter,sans-serif;letter-spacing:.14em;margin-left:6px;color:var(--mute)}
/* drift meter, right centre: multiplier on top, a tall bar filling ×1 → ×5 with a combo clock beside it, points underneath */
#driftMtr{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:76px;padding:10px 8px;display:grid;justify-items:center;gap:6px;background:var(--glass);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:.55;transition:opacity .2s,box-shadow .2s}
#driftMtr.on{opacity:1;box-shadow:0 0 0 2px rgba(255,194,61,.8),0 0 26px rgba(255,140,40,.55)}
#driftMtr .lbl{font-size:9.5px;letter-spacing:.12em}#driftMtr .lbl .uico{display:none}
#driftMtr .mul{font:800 22px/1 Rubik,sans-serif;color:var(--haz);font-variant-numeric:tabular-nums}
#driftMtr .bars{display:flex;gap:5px;height:clamp(120px,30vh,230px)}
#driftMtr .tube{position:relative;width:20px;height:100%;border-radius:10px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
#driftMtr .tube i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#ffc23d,#ff8a2a 55%,#ff3b2a);transition:height .12s}
#driftMtr .tube b{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.35)}
#driftMtr .clock{position:relative;width:5px;height:100%;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
#driftMtr .clock i{position:absolute;left:0;right:0;bottom:0;height:0;background:#fff}
#driftMtr .pts{font:700 15px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
#driftMtr.bank{animation:bank .5s ease-out}
@keyframes bank{0%{transform:translateY(-50%) scale(1.12);box-shadow:0 0 0 3px #7fdcaa,0 0 30px rgba(127,220,170,.8)}100%{transform:translateY(-50%) scale(1)}}
/* red pulse on the screen edges while a thief's hose drains your tank */
#craneSign{position:absolute;left:50%;top:96px;width:min(340px,80vw);padding:12px 16px 14px;transform:translate(-50%,-30px) rotate(-2deg);opacity:0;pointer-events:none;text-align:center;
  background:linear-gradient(170deg,#f4f1ea,#d9d4c8 60%,#c7c0b0);border-radius:6px;box-shadow:0 0 0 3px #2a2826,0 0 0 6px #d9d4c8,0 14px 30px rgba(0,0,0,.5);color:#1d1b1a;transition:opacity .2s,transform .25s}
#craneSign::before,#craneSign::after{content:"";position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#8a857c 40%,#55514b 45%)}#craneSign::before{left:8px}#craneSign::after{right:8px}
#craneSign.on{opacity:1;transform:translate(-50%,0) rotate(-2deg);animation:signShake .45s ease-in-out infinite}
#craneSign.art{background:center/100% 100% no-repeat var(--art);box-shadow:none}
#craneSign.art>*{visibility:hidden}
#craneSign .oval{display:inline-block;margin:0 auto 6px;padding:4px 26px;border-radius:50%;background:#d62a1f;color:#fff;font:900 22px/1.1 Rubik,Impact,sans-serif;letter-spacing:.08em;box-shadow:0 0 0 3px #1d1b1a,0 0 0 5px #fff,0 0 0 7px #1d1b1a}
#craneSign b{display:block;font:900 clamp(26px,5vw,38px)/1 Rubik,Impact,sans-serif;letter-spacing:.02em}
#craneSign span{display:block;margin-top:6px;font:700 13px Inter,sans-serif;color:#3a2a20}
#craneSign .cs-ball{position:absolute;right:16px;bottom:12px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a7c80,#1d1b1a);transform-origin:50% -26px;animation:swingB .9s ease-in-out infinite alternate}
#craneSign .cs-ball::before{content:"";position:absolute;left:12px;top:-26px;width:2px;height:26px;background:#1d1b1a}
@keyframes signShake{0%,100%{transform:translate(-50%,0) rotate(-2deg)}50%{transform:translate(-50%,2px) rotate(1.5deg)}}
@keyframes swingB{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
@media(prefers-reduced-motion:reduce){#craneSign.on,#craneSign .cs-ball{animation:none}}
/* pause menu and settings */
.pmenu{display:grid;gap:10px;width:min(320px,90vw)}.pmenu .btn{width:100%}.pmenu .small{text-align:center;margin:0}
.btn.warnb{background:#5a2a22;box-shadow:0 4px 0 #3a1a14}
.opts{display:grid;gap:14px;width:min(460px,92vw)}
.opt{display:grid;gap:6px;background:var(--glass);border-radius:12px;padding:12px 14px}.opt b{font:700 14px Inter,sans-serif}
.seg3{display:flex;gap:6px;flex-wrap:wrap}.seg3 button{flex:1;min-height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font:700 14px Inter,sans-serif;cursor:pointer}
.seg3 button.on{background:var(--rust)}.seg3 button:focus-visible{outline:2px solid var(--haz)}
.gear{margin-left:auto}
#vign{position:absolute;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 70px 18px rgba(255,40,25,.55);transition:opacity .25s}
#vign.on{animation:vign .8s ease-in-out infinite}
@keyframes vign{0%,100%{opacity:.35}50%{opacity:1}}
#count{position:absolute;left:0;right:0;top:52%;text-align:center;font:800 clamp(48px,8vw,96px)/1 Rubik,sans-serif;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.35);opacity:0;pointer-events:none}
#count.on{animation:cnt .95s ease-out forwards}#count.go{color:var(--haz)}
@keyframes cnt{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
#fx .hbar{position:absolute;left:0;top:0;display:none;height:6px;border-radius:3px;background:rgba(15,15,14,.75);box-shadow:0 0 0 1.5px rgba(0,0,0,.5);overflow:hidden}.hbar i{display:block;height:100%;border-radius:3px}
#fx .ptag{position:absolute;left:0;top:0;width:max-content;display:none;padding:4px 8px 5px;border-radius:8px;background:rgba(20,20,18,.82);font:700 13px Inter,sans-serif;color:#efe3c8;text-align:center;min-width:64px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#fx .ptag i{display:block;height:5px;margin-top:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}.ptag u{display:block;height:100%;background:#7fdcaa}
#fx .ptag.dry{color:#ff6b5a;box-shadow:0 0 0 2px #ff4a30}#fx .ptag.dry i{display:none}#fx .ptag.soon{color:#7fdcaa;animation:blink .8s steps(2) infinite}#fx .ptag.soon i{display:none}
#fx .ptag.on{color:#7fdcaa;box-shadow:0 0 0 2px #7fdcaa,0 0 14px rgba(127,220,170,.6)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;opacity:0}
#banner b{display:block;font:800 clamp(36px,7vw,72px)/1 Rubik,sans-serif;text-transform:uppercase;color:#ff3b2a;text-shadow:0 4px 0 rgba(60,8,4,.55),0 0 22px rgba(255,59,42,.35)}
#banner span{font:600 18px Inter,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#banner.go{animation:ban 2.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

/* overlays */
.ov{position:absolute;inset:0;background:linear-gradient(rgba(24,26,30,.35),rgba(24,26,30,.8));background-size:cover;background-position:center;overflow:auto;padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;align-items:center;gap:16px}
.ov>*{width:min(1180px,100%)}
.ov h1{font:800 clamp(40px,7vw,76px)/1 Rubik,sans-serif;margin:0;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.ov h1 img{max-width:min(600px,100%);max-height:24vh;width:auto;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.ov h2{font:800 clamp(24px,3.2vw,36px)/1.05 Rubik,sans-serif;margin:0}
.sub{color:var(--mute);margin:0}
#menu .sub{color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.5)}
.menuhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.car{font:inherit;color:inherit;text-align:left;background:var(--glass2);backdrop-filter:blur(6px);border:2px solid transparent;border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:transform .12s,border-color .12s}
.car:hover,.car:focus-visible{border-color:var(--haz);transform:translateY(-3px);outline:none}
.car img{width:100%;aspect-ratio:48/26;object-fit:cover;border-radius:10px;background:linear-gradient(#bfe0a0,#8fc26a)}
.car b{font:800 19px/1.15 Rubik,sans-serif}
.d{color:var(--mute);font-size:15px;line-height:1.35}
.bar{display:grid;grid-template-columns:5.4em minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.bar i{display:block;height:6px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.bar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--rust)}
#packs{display:grid;gap:8px}
.pack{position:relative;border-radius:16px;padding:16px 18px;min-height:132px;background-size:cover;background-position:center;display:flex;flex-direction:column;gap:6px;opacity:.92;overflow:hidden}
.pack b{font:800 24px/1.1 Rubik,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.pack .d{color:#fff;max-width:40ch;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.soon{position:absolute;top:12px;right:12px;font:800 12px Rubik,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:var(--haz);color:#2a2c30;border-radius:999px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.chips span{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border-radius:12px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600}
.chips img{width:76px;height:41px;object-fit:cover;border-radius:8px;filter:saturate(.85)}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mute);font-size:15px}
kbd{font:700 12px Inter,sans-serif;background:rgba(255,255,255,.12);border-radius:5px;padding:2px 7px;color:#fff;border-bottom:2px solid rgba(0,0,0,.35)}

/* garage */
#shop{background-color:#1b1c20;background-image:radial-gradient(120% 80% at 50% 0%,#2a2c32,#17181b 70%)}
.shophead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.scrapct{font:800 24px Rubik,sans-serif;color:var(--haz)}
.garage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.75fr);gap:16px;align-items:start}
.col{display:grid;gap:10px}
#cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--glass2);border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover,.card:focus-visible{border-color:var(--haz);transform:translateX(3px);outline:none}
.card.locked{border-color:var(--bp)}
.card.poor{opacity:.55;cursor:not-allowed}.card.poor:hover{transform:none}
.card.sold{opacity:.35;cursor:default}
.ico{flex:none;width:52px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--c) 28%,#2a2c30);display:grid;place-items:center;overflow:hidden;font:800 24px Rubik,sans-serif;color:var(--c)}
.ico.xs{width:28px;height:28px;border-radius:8px;font-size:14px}
.ico img{width:100%;height:100%;object-fit:cover}
.cbody{display:flex;flex-direction:column;gap:2px}
.tag{font-size:12px;color:var(--mute)}
.nm{font:800 17px/1.15 Rubik,sans-serif}
.card .d{font-size:14px}
.note{font-size:12px;font-weight:700;color:var(--bp)}.card.swap .note{color:#ff9a7a}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price{font-weight:700;color:var(--haz);white-space:nowrap}
.lockbtn{display:inline-flex;align-items:center;gap:5px;font:600 12px Inter,sans-serif;color:var(--mute);background:rgba(255,255,255,.08);border:0;border-radius:8px;padding:6px 8px;min-height:32px;cursor:pointer}
.lockbtn[aria-pressed=true]{background:var(--bp);color:#16202a}
.lockbtn:focus-visible{outline:2px solid var(--haz)}
.hint{font-size:13px;color:var(--mute);margin:0}
.bp{background:rgba(22,40,58,.85);border:1px solid rgba(143,208,234,.35);border-radius:16px;padding:12px;background-image:linear-gradient(rgba(143,208,234,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(143,208,234,.08) 1px,transparent 1px);background-size:20px 20px}
.bpwrap{width:100%;max-width:180px;margin:0 auto}
.bpwrap svg{display:block;width:100%;height:auto}
.car-o rect{fill:rgba(143,208,234,.08);stroke:var(--bp);stroke-width:2}.car-o line{stroke:var(--bp);stroke-width:1.5;stroke-dasharray:4 4}
.mk circle{fill:#16283a;stroke:rgba(143,208,234,.6);stroke-width:2}.mk.on circle{fill:var(--bp);stroke:var(--bp)}
.mk text{font:800 14px Rubik,sans-serif;text-anchor:middle;fill:var(--bp)}.mk.on text{fill:#16283a}
.mk.hl circle{stroke:var(--haz);stroke-width:4}
.bplist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.bprow{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;align-items:center;gap:8px;background:rgba(16,28,40,.85);border:1.5px solid rgba(143,208,234,.3);border-radius:10px;padding:5px 8px;transition:border-color .12s,box-shadow .12s}
.bprow.on{border-color:rgba(143,208,234,.7)}.bprow.hl{border-color:var(--haz);box-shadow:0 0 0 3px rgba(255,194,61,.3)}
.bprow .num{font:800 13px Rubik,sans-serif;color:var(--bp);text-align:center}
.bprow .sl{display:grid;gap:1px}
.sn{font:700 10px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--bp)}
.pn{font-size:13.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}.pn.empty{color:var(--mute);font-weight:500;font-style:italic}
.bprow .lv{font-size:11px;color:var(--haz);white-space:nowrap}
/* sticky footer, pushed to the bottom of the screen when the garage is shorter than the window: a full-width frosted bar (box-shadow + clip-path bleed it to both screen edges) */
.gfoot{margin-top:auto;position:sticky;bottom:calc(-1 * clamp(18px,4vw,44px));margin-bottom:calc(-1 * clamp(18px,4vw,44px));padding:14px 0 clamp(18px,4vw,44px);background:rgba(20,21,25,.9);box-shadow:0 0 0 100vmax rgba(20,21,25,.9);clip-path:inset(0 -100vmax);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);z-index:2}
.panel{background:var(--glass2);border-radius:16px;padding:14px 16px}
.panel h3{margin:0 0 8px;font:800 17px Rubik,sans-serif}
.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:3px 0;font-size:14px}
.stat span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:800 16px/1 Rubik,sans-serif;min-height:48px;padding:14px 22px;border-radius:12px;border:0;cursor:pointer;background:var(--rust);color:#fff;box-shadow:0 4px 0 #a8341f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a8341f}
.btn.alt{background:var(--glass2);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--haz);outline-offset:2px}
.center{justify-content:center;text-align:center}.center>*{width:auto}
.wrecked{font:800 clamp(48px,9vw,96px)/1 Rubik,sans-serif;color:var(--rust);margin:0;text-shadow:0 6px 0 rgba(0,0,0,.3)}
.pb{color:var(--haz)}
.edge{position:absolute;left:0;top:0;display:none;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:16px solid #ff4a30;filter:drop-shadow(0 0 6px rgba(255,60,30,.8))}
.pbadge{position:absolute;left:0;top:0;display:none;width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.edge.pu{border-left-color:#7fdcaa;filter:drop-shadow(0 0 8px rgba(127,220,170,.9))}
.edge.el{border-top-width:13px;border-bottom-width:13px;border-left:22px solid var(--haz);filter:drop-shadow(0 0 8px rgba(255,194,61,.9))}
.meter span b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
#touch button{pointer-events:auto;touch-action:none;border:0;border-radius:50%;background:rgba(34,36,40,.6);color:#fff;font:800 15px Rubik,sans-serif;backdrop-filter:blur(4px);box-shadow:0 4px 0 rgba(0,0,0,.35);-webkit-user-select:none;user-select:none}
#touch button.on{background:rgba(232,85,58,.85)}
#touch .tl2{position:absolute;left:16px;bottom:20px;display:flex;gap:14px}
#touch .tr2{position:absolute;right:16px;bottom:20px;display:grid;grid-template-columns:auto auto;gap:12px;align-items:end}
#touch .b{width:74px;height:74px;font-size:26px}#touch .gas{width:92px;height:92px;background:rgba(232,85,58,.6)}
#touch .s{width:60px;height:60px;font-size:12px}#touch .nitro{background:rgba(95,200,240,.5)}
#tPause{position:absolute;left:16px;bottom:116px;width:48px;height:48px;font-size:14px}
@media(pointer:coarse){#touch{display:block}#driftMtr{top:42%}#cluster{bottom:184px;left:8px;width:clamp(190px,34vw,260px)}#tPause{bottom:116px}}
@media(max-width:900px){.tl{width:min(240px,30vw)}#bossPnl{width:min(360px,36vw)}}
@media(max-width:700px){.tl{width:52vw;padding:8px 10px 8px 14px;gap:6px}.badge{width:30px;height:30px}.badge.sm{width:24px;height:24px}.plate .hd .val{font-size:13px}.plate .hd .chip{display:none}.tr{padding:8px 12px 8px 16px;gap:8px}.sico{width:44px;height:44px}.snum{font-size:26px}.num{font-size:22px}
  #bossPnl{top:84px;width:min(300px,76vw)}#cluster{width:205px}#banner{top:40%}.meter span{font-size:9.5px;padding:0 6px}#driftMtr{width:60px;padding:8px 6px}#driftMtr .bars{height:clamp(100px,19vh,160px)}#driftMtr .mul{font-size:18px}#driftMtr .pts{font-size:13px}.big{font-size:36px}}
@media(max-width:1000px){.garage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.garage .panel{grid-column:1/-1}}
@media(max-width:820px){.grid3{grid-template-columns:minmax(0,1fr)}.car{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:12px}.car img{grid-row:span 7}.garage{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.gfoot .btn{padding:10px 14px;font-size:14px;min-height:44px}.gfoot{gap:8px}.grid2{grid-template-columns:minmax(0,1fr)}.car{grid-template-columns:minmax(0,1fr)}.car img{grid-row:auto}.tl{width:44vw;padding:10px}.lockbtn span{display:none}}
@media(prefers-reduced-motion:reduce){#vign.on{animation:none;opacity:.7}.car,.card,#driftMtr{transition:none}#driftMtr.bank{animation:none}#banner.go{animation-duration:.01s;opacity:1}.ld .tyre{animation:none}}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="stage">
  <div id="gl"></div>
  <div id="fx"></div>

  <div id="hud" class="hide">
    <!-- top left: riveted steel plate with hull and heat gauges -->
    <div class="plate tl" id="hullPlate">
      <div class="row"><span class="badge" data-ico="hull"></span>
        <div class="col"><div class="hd"><b data-i18n="hull">Hull</b><b class="val" id="hpTxt"></b></div><div class="seg hull"><i id="hpBar"></i></div></div></div>
      <div class="row"><span class="badge sm" data-ico="heat"></span>
        <div class="col"><div class="hd"><b data-i18n="heat">Heat</b><b class="val chip" id="heatTxt"></b></div><div class="seg heat"><i id="heatBar"></i></div></div></div>
    </div>
    <div class="pnl hide" id="bossPnl"><div class="lbl" data-ui="boss"><span id="eliteName"></span></div><div class="meter"><i id="bossBar"></i></div></div>
    <!-- top right: the scrap counter, a big painted icon and a punchy number that bumps when it grows -->
    <div class="plate tr" id="scrapPlate"><span class="sico" data-ico="scrap"></span>
      <div class="col"><b class="lbl2" data-i18n="scrap">Scrap</b><div class="snum" id="scrapTxt">0</div><div class="wrk" id="wreckTxt">0 wrecks</div></div><b class="bump" id="scrapBump"></b></div>
    <!-- gauge cluster: speedo with the lap shown as a gear, fuel dial top-left, nitro LEDs bottom-right (built in ui.js) -->
    <div id="cluster" role="img" aria-label="Speed, lap, fuel and nitro"></div>
    <div id="driftMtr" aria-label="Drift"><div class="lbl" data-ui="drift"><span data-i18n="drift">Drift</span></div><div class="mul" id="driftMul">×1.0</div><div class="bars"><div class="clock"><i id="driftClock"></i></div><div class="tube"><i id="driftFill"></i><b style="bottom:25%"></b><b style="bottom:50%"></b><b style="bottom:75%"></b></div></div><div class="pts" id="driftNum">0</div></div>
    <div id="vign"></div>
    <!-- wrecking-ball warning: a battered DANGER road sign that drops in during the crane warning -->
    <div id="craneSign" aria-live="assertive"><div class="oval" id="csTop">GEVAAR</div><b id="csBig">SLOOPKOGEL</b><span id="csSub"></span><i class="cs-ball"></i></div>
    <div id="count" aria-live="polite"></div>
    <div id="banner"><b></b><span></span></div>
    <div id="touch" aria-hidden="true">
      <div class="tl2"><button class="b" data-key="ArrowLeft">◀</button><button class="b" data-key="ArrowRight">▶</button></div>
      <div class="tr2"><button class="s nitro" data-key="ShiftLeft">NOS</button><button class="b gas" data-key="ArrowUp">▲</button>
        <button class="s" data-key="ArrowDown">▼</button><button class="b" data-key="Space">⟲</button></div>
      <button id="tPause">II</button>
    </div>
  </div>

  <div class="ov" id="menu">
    <div class="menuhead"><h1 id="title">Ottokeirkhof</h1><button class="btn alt gear" id="mSettings" aria-label="Settings">⚙ <span data-i18n="settings">Settings</span></button></div>
    <p class="sub" id="bestLine"></p>
    <div class="grid3" id="cars"></div>
    <div id="packs"></div>
    <div class="keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / ↑←↓→: <span data-i18n="k_drive">drive</span></span>
      <span><kbd>Space</kbd> <span data-i18n="k_hb">handbrake</span></span>
      <span><kbd>Shift</kbd> <span data-i18n="k_nitro">nitro</span></span>
      <span><kbd>P</kbd> <span data-i18n="k_pause">pause</span></span>
      <span data-i18n="k_tip"></span>
    </div>
  </div>

  <div class="ov hide" id="shop">
    <div class="shophead"><h2 id="shopTitle">Garage</h2><span class="scrapct" id="shopScrap">0</span></div>
    <div class="garage">
      <section class="col">
        <div class="lbl" data-i18n="forSale">For sale</div>
        <div id="cards"></div>
        <p class="hint" id="lockHint"></p>
      </section>
      <section class="col bp"><div class="lbl" data-i18n="blueprint" style="color:var(--bp)">Blueprint</div><div id="blueprint"></div></section>
      <section class="panel" id="build"></section>
    </div>
    <div class="gfoot row"><button class="btn" id="go" data-i18n="next">Next lap</button><button class="btn alt" id="reroll">Reroll</button><button class="btn alt" id="repair">Repair</button></div>
  </div>

  <div class="ov hide center" id="over">
    <p class="wrecked" id="wreckedTxt">Wrecked</p>
    <p class="sub" id="overStats"></p>
    <div class="row" style="justify-content:center"><button class="btn" id="again" data-i18n="back">Back to the pits</button></div>
  </div>

  <div class="ov hide center" id="pause">
    <h2 data-i18n="paused">Paused</h2>
    <div class="pmenu">
      <button class="btn" id="resume" data-i18n="resume">Resume</button>
      <button class="btn alt" id="pSettings" data-i18n="settings">Settings</button>
      <button class="btn alt" id="pGarage" data-i18n="toGarage">Garage</button>
      <button class="btn alt warnb" id="pMenu" data-i18n="toMenu">Main menu</button>
      <p class="small" data-i18n="toMenuHint"></p>
    </div>
  </div>

  <div class="ov hide center" id="settings">
    <h2 data-i18n="settings">Settings</h2>
    <div class="opts" id="optList"></div>
    <div class="row" style="justify-content:center"><button class="btn" id="optBack" data-i18n="back2">Back</button></div>
  </div>

  <div id="loading">
    <div class="ld">
      <img class="lg" id="loadLogo" alt="" hidden>
      <div class="tyre" aria-hidden="true"></div>
      <div id="loadMsg">Warming up the engines…</div>
      <div class="track"><i id="loadBar"></i></div>
      <div id="loadPct">0%</div>
      <p id="loadTip"></p>
    </div>
  </div>
</div>
<noscript>Ottokeirkhof eit JavaScript en WebGL nodig.</noscript>
<script>
  // show the logo on the loading screen straight away, before the game code arrives
  { const img = document.getElementById('loadLogo');
    img.onload = () => { img.hidden = false };
    img.src = 'assets/logo-vls.png'; }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
