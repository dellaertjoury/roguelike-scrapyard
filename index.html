<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrapyard Derby</title>
<meta name="description" content="A low-poly drift-and-wreck survival roguelike. Drift to charge your guns, ram to wreck, build your car between laps.">
<meta property="og:title" content="Scrapyard Derby">
<meta property="og:description" content="Drift to charge your guns, ram to wreck, build your junker between laps.">
<meta property="og:image" content="https://dellaertjoury.github.io/roguelike-scrapyard/assets/og.jpg">
<meta property="og:url" content="https://dellaertjoury.github.io/roguelike-scrapyard/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sunny, toy-like, low-poly racing; clean glassy HUD panels
   IDEA: a dirt derby arena seen from a TV camera crane, a workshop blueprint between laps
   PICTURE: the live 3D arena fills the screen
   COLOUR and TYPE: grass green world, charcoal glass panels, rust orange + hazard yellow accents; Rubik + Inter
   LAYOUT: full-screen canvas, HUD in the four corners, overlays centred */
:root{color-scheme:dark;--glass:rgba(34,36,40,.8);--glass2:rgba(48,50,56,.9);--ink:#fff;--mute:#c3c7cf;--rust:#e8553a;--haz:#ffc23d;--nitro:#5fc8f0;--line:rgba(255,255,255,.12);--bp:#8fd0ea}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#9fcf7e;color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;user-select:none}
#gl{position:absolute;inset:0}#gl canvas{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx div{position:absolute;left:0;top:0;display:none;font:700 16px Inter,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap}
.hide{display:none!important}
.lbl{font:700 11px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.uico{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:6px}

/* loading screen */
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px;text-align:center;
  background:url(assets/loading-bg.jpg) center/cover,url(assets/menu-bg.jpg) center/cover,#24262b;transition:opacity .5s}
#loading::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(24,26,30,.55),rgba(24,26,30,.85))}
#loading.done{opacity:0;pointer-events:none}
.ld{position:relative;display:grid;justify-items:center;gap:18px;width:min(560px,100%)}
.ld img.lg{max-width:min(520px,100%);max-height:30vh;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.ld .tyre{width:68px;height:68px;border-radius:50%;border:9px dashed #141312;background:radial-gradient(circle,#c9ccd2 0 18%,#2a2826 19% 54%,#e24a32 55% 62%,#2a2826 63%);box-shadow:0 0 0 3px #2a2826,0 6px 0 rgba(0,0,0,.3);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.track{width:100%;height:12px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.track i{display:block;height:100%;width:4%;background:repeating-linear-gradient(-45deg,var(--haz) 0 10px,#e8a92a 10px 20px);border-radius:8px;transition:width .2s}
#loadMsg{font:800 22px Rubik,sans-serif}#loadTip{color:var(--mute);min-height:3em;max-width:46ch}
#loadPct{font:600 13px Inter,sans-serif;color:var(--mute)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.pnl{position:absolute;background:var(--glass);backdrop-filter:blur(6px);border-radius:14px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tl{left:16px;top:16px;width:min(280px,40vw);display:grid;gap:7px}
.meter{position:relative;height:18px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.meter.sm{height:12px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--rust);border-radius:6px;transition:width .1s}
.meter i.low{background:#ff3b30}
.meter.nitro i{background:var(--nitro)}.meter.nitro i.on{background:#bdf0ff}
.meter.heat i{background:var(--haz)}
.meter span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font:700 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.meter.sm span{font-size:10px}
.tc{left:50%;top:16px;transform:translateX(-50%);text-align:center;min-width:200px}
.timer{font:600 clamp(28px,4vw,42px)/1.1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:6px}
.timer.warn{color:var(--haz)}
#dashes{display:flex;gap:5px;justify-content:center;margin-top:8px}
#dashes i{width:14px;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}#dashes i.on{background:#fff}
#bossPnl{left:50%;top:136px;transform:translateX(-50%);width:min(440px,70vw);display:grid;gap:6px}
#bossPnl .meter i{background:#e0b040}
.tr{right:16px;top:16px;text-align:right;min-width:120px}
.num{font:600 clamp(26px,3.4vw,36px)/1.1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
.small{color:var(--mute);font-size:13px}
.bl{left:16px;bottom:16px;min-width:150px}
.ang{color:var(--rust);font:600 18px Inter,sans-serif}
.big{font:600 clamp(44px,6vw,64px)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.big small,.num small{font:700 12px Inter,sans-serif;letter-spacing:.14em;margin-left:6px;color:var(--mute)}
.br{right:16px;bottom:16px;text-align:right;min-width:130px;transition:box-shadow .2s,background .2s,transform .2s}
.br.hot{background:linear-gradient(135deg,rgba(232,85,58,.9),rgba(255,160,40,.85));box-shadow:0 0 0 2px #ffc23d,0 0 28px rgba(255,140,40,.7);transform:scale(1.06)}
.br.hot .lbl,.br.hot small{color:#fff}
#banner{position:absolute;left:0;right:0;top:20%;text-align:center;opacity:0}
#banner img{display:block;margin:0 auto 10px;width:min(420px,70vw);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#banner b{display:block;font:800 clamp(36px,7vw,72px)/1 Rubik,sans-serif;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.25)}
#banner span{font:600 18px Inter,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#banner.go{animation:ban 2.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

/* overlays */
.ov{position:absolute;inset:0;background:linear-gradient(rgba(24,26,30,.35),rgba(24,26,30,.8));background-size:cover;background-position:center;overflow:auto;padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;align-items:center;gap:16px}
.ov>*{width:min(1180px,100%)}
.ov h1{font:800 clamp(40px,7vw,76px)/1 Rubik,sans-serif;margin:0;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.ov h1 img{max-width:min(600px,100%);max-height:24vh;width:auto;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.ov h2{font:800 clamp(24px,3.2vw,36px)/1.05 Rubik,sans-serif;margin:0}
.sub{color:var(--mute);margin:0}
#menu .sub{color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.5)}
.menuhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
#langs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--glass);border-radius:12px;padding:6px 8px}
#langs .lbl{padding:0 6px}
.lang{font:600 14px Inter,sans-serif;color:#fff;background:transparent;border:0;border-radius:8px;padding:8px 10px;min-height:36px;cursor:pointer}
.lang.on{background:var(--rust)}.lang:focus-visible{outline:2px solid var(--haz)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.car{font:inherit;color:inherit;text-align:left;background:var(--glass2);backdrop-filter:blur(6px);border:2px solid transparent;border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:transform .12s,border-color .12s}
.car:hover,.car:focus-visible{border-color:var(--haz);transform:translateY(-3px);outline:none}
.car img{width:100%;aspect-ratio:48/26;object-fit:cover;border-radius:10px;background:linear-gradient(#bfe0a0,#8fc26a)}
.car b{font:800 19px/1.15 Rubik,sans-serif}
.d{color:var(--mute);font-size:15px;line-height:1.35}
.bar{display:grid;grid-template-columns:5.4em minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.bar i{display:block;height:6px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.bar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--rust)}
#packs{display:grid;gap:8px}
.pack{position:relative;border-radius:16px;padding:16px 18px;min-height:132px;background-size:cover;background-position:center;display:flex;flex-direction:column;gap:6px;opacity:.92;overflow:hidden}
.pack b{font:800 24px/1.1 Rubik,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.pack .d{color:#fff;max-width:40ch;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.soon{position:absolute;top:12px;right:12px;font:800 12px Rubik,sans-serif;letter-spacing:.08em;text-transform:uppercase;background:var(--haz);color:#2a2c30;border-radius:999px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.chips span{background:rgba(0,0,0,.35);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.keys{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mute);font-size:15px}
kbd{font:700 12px Inter,sans-serif;background:rgba(255,255,255,.12);border-radius:5px;padding:2px 7px;color:#fff;border-bottom:2px solid rgba(0,0,0,.35)}

/* garage */
#shop{background-color:#202227}
.shophead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.scrapct{font:800 24px Rubik,sans-serif;color:var(--haz)}
.garage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.75fr);gap:16px;align-items:start}
.col{display:grid;gap:10px}
#cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--glass2);border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover,.card:focus-visible{border-color:var(--haz);transform:translateX(3px);outline:none}
.card.locked{border-color:var(--bp)}
.card.poor{opacity:.55;cursor:not-allowed}.card.poor:hover{transform:none}
.card.sold{opacity:.35;cursor:default}
.ico{flex:none;width:52px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--c) 28%,#2a2c30);display:grid;place-items:center;overflow:hidden;font:800 24px Rubik,sans-serif;color:var(--c)}
.ico.xs{width:28px;height:28px;border-radius:8px;font-size:14px}
.ico img{width:100%;height:100%;object-fit:cover}
.cbody{display:flex;flex-direction:column;gap:2px}
.tag{font-size:12px;color:var(--mute)}
.nm{font:800 17px/1.15 Rubik,sans-serif}
.card .d{font-size:14px}
.note{font-size:12px;font-weight:700;color:var(--bp)}.card.swap .note{color:#ff9a7a}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price{font-weight:700;color:var(--haz);white-space:nowrap}
.lockbtn{display:inline-flex;align-items:center;gap:5px;font:600 12px Inter,sans-serif;color:var(--mute);background:rgba(255,255,255,.08);border:0;border-radius:8px;padding:6px 8px;min-height:32px;cursor:pointer}
.lockbtn[aria-pressed=true]{background:var(--bp);color:#16202a}
.lockbtn:focus-visible{outline:2px solid var(--haz)}
.hint{font-size:13px;color:var(--mute);margin:0}
.bp{background:rgba(22,40,58,.85);border:1px solid rgba(143,208,234,.35);border-radius:16px;padding:12px;background-image:linear-gradient(rgba(143,208,234,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(143,208,234,.08) 1px,transparent 1px);background-size:20px 20px}
.bpwrap{width:100%;max-width:180px;margin:0 auto}
.bpwrap svg{display:block;width:100%;height:auto}
.car-o rect{fill:rgba(143,208,234,.08);stroke:var(--bp);stroke-width:2}.car-o line{stroke:var(--bp);stroke-width:1.5;stroke-dasharray:4 4}
.mk circle{fill:#16283a;stroke:rgba(143,208,234,.6);stroke-width:2}.mk.on circle{fill:var(--bp);stroke:var(--bp)}
.mk text{font:800 14px Rubik,sans-serif;text-anchor:middle;fill:var(--bp)}.mk.on text{fill:#16283a}
.mk.hl circle{stroke:var(--haz);stroke-width:4}
.bplist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.bprow{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;align-items:center;gap:8px;background:rgba(16,28,40,.85);border:1.5px solid rgba(143,208,234,.3);border-radius:10px;padding:5px 8px;transition:border-color .12s,box-shadow .12s}
.bprow.on{border-color:rgba(143,208,234,.7)}.bprow.hl{border-color:var(--haz);box-shadow:0 0 0 3px rgba(255,194,61,.3)}
.bprow .num{font:800 13px Rubik,sans-serif;color:var(--bp);text-align:center}
.bprow .sl{display:grid;gap:1px}
.sn{font:700 10px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--bp)}
.pn{font-size:13.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}.pn.empty{color:var(--mute);font-weight:500;font-style:italic}
.bprow .lv{font-size:11px;color:var(--haz);white-space:nowrap}
.gfoot{position:sticky;bottom:calc(-1 * clamp(18px,4vw,44px));margin-bottom:calc(-1 * clamp(18px,4vw,44px));padding:14px 0 clamp(18px,4vw,44px);background:linear-gradient(rgba(32,34,39,0),rgba(32,34,39,.97) 22%);z-index:2}
.panel{background:var(--glass2);border-radius:16px;padding:14px 16px}
.panel h3{margin:0 0 8px;font:800 17px Rubik,sans-serif}
.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:3px 0;font-size:14px}
.stat span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:800 16px/1 Rubik,sans-serif;min-height:48px;padding:14px 22px;border-radius:12px;border:0;cursor:pointer;background:var(--rust);color:#fff;box-shadow:0 4px 0 #a8341f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a8341f}
.btn.alt{background:var(--glass2);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--haz);outline-offset:2px}
.center{justify-content:center;text-align:center}.center>*{width:auto}
.wrecked{font:800 clamp(48px,9vw,96px)/1 Rubik,sans-serif;color:var(--rust);margin:0;text-shadow:0 6px 0 rgba(0,0,0,.3)}
.pb{color:var(--haz)}
.edge{position:absolute;left:0;top:0;display:none;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:16px solid #ff4a30;filter:drop-shadow(0 0 6px rgba(255,60,30,.8))}
.edge.el{border-top-width:13px;border-bottom-width:13px;border-left:22px solid var(--haz);filter:drop-shadow(0 0 8px rgba(255,194,61,.9))}
.meter span b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
#touch button{pointer-events:auto;touch-action:none;border:0;border-radius:50%;background:rgba(34,36,40,.6);color:#fff;font:800 15px Rubik,sans-serif;backdrop-filter:blur(4px);box-shadow:0 4px 0 rgba(0,0,0,.35);-webkit-user-select:none;user-select:none}
#touch button.on{background:rgba(232,85,58,.85)}
#touch .tl2{position:absolute;left:16px;bottom:20px;display:flex;gap:14px}
#touch .tr2{position:absolute;right:16px;bottom:20px;display:grid;grid-template-columns:auto auto;gap:12px;align-items:end}
#touch .b{width:74px;height:74px;font-size:26px}#touch .gas{width:92px;height:92px;background:rgba(232,85,58,.6)}
#touch .s{width:60px;height:60px;font-size:12px}#touch .nitro{background:rgba(95,200,240,.5)}
#tPause{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:48px;height:48px;font-size:14px}
@media(pointer:coarse){#touch{display:block}.bl{display:none}.br{bottom:auto;top:120px}}
@media(max-width:900px){.tl{width:min(240px,30vw)}.tc{min-width:170px}}
@media(max-width:700px){.tl{width:46vw;padding:8px 10px;gap:5px}.tr{min-width:0;padding:8px 12px}.num{font-size:22px}
  .tc{top:84px;min-width:0;padding:6px 12px}.timer{font-size:22px;margin-top:2px}#dashes{margin-top:4px}#dashes i{width:9px}
  #bossPnl{top:150px}.meter span{font-size:9.5px;padding:0 6px}.br{padding:8px 12px;min-width:0}.big{font-size:36px}}
@media(max-width:1000px){.garage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.garage .panel{grid-column:1/-1}}
@media(max-width:820px){.grid3{grid-template-columns:minmax(0,1fr)}.car{display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:12px}.car img{grid-row:span 7}.garage{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}.car{grid-template-columns:minmax(0,1fr)}.car img{grid-row:auto}.tc{min-width:0;padding:8px 12px}.tl{width:44vw;padding:10px}.bl,.br{padding:8px 12px;min-width:0}#bossPnl{top:116px}.lockbtn span{display:none}}
@media(prefers-reduced-motion:reduce){.car,.card,.br{transition:none}#banner.go{animation-duration:.01s;opacity:1}.ld .tyre{animation:none}}
</style>

</script>

<body>
<div id="stage">
  <div id="gl"></div>
  <div id="fx"></div>

  <div id="hud" class="hide">
    <div class="pnl tl">
      <div class="meter"><i id="hpBar"></i><span><b data-ui="hull" data-i18n="hull">Hull</b><b id="hpTxt"></b></span></div>
      <div class="meter sm nitro"><i id="nitroBar"></i><span><b data-ui="nitro" data-i18n="nitro">Nitro</b></span></div>
      <div class="meter sm heat"><i id="heatBar"></i><span data-ui="heat"><b id="heatTxt">Heat</b></span></div>
    </div>
    <div class="pnl tc">
      <div class="lbl" data-ui="lap"><span id="waveLbl">Lap 1</span></div>
      <div class="timer" id="timer">0:00.00</div>
      <div id="dashes"></div>
    </div>
    <div class="pnl hide" id="bossPnl"><div class="lbl" data-ui="boss"><span id="eliteName"></span></div><div class="meter"><i id="bossBar"></i></div></div>
    <div class="pnl tr"><div class="lbl" data-ui="scrap"><span data-i18n="scrap">Scrap</span></div><div class="num" id="scrapTxt">0</div><div class="small" id="wreckTxt">0 wrecks</div></div>
    <div class="pnl bl"><div class="ang" id="angTxt">0°</div><div class="big"><span id="spdTxt">0</span><small data-i18n="kmh">KM/H</small></div></div>
    <div class="pnl br" id="driftPnl"><div class="lbl" data-ui="drift"><span data-i18n="drift">Drift</span></div><div class="num"><span id="driftNum">0</span><small id="driftMul">×1.0</small></div></div>
    <div id="banner"><img id="bannerArt" alt="" hidden><b></b><span></span></div>
    <div id="touch" aria-hidden="true">
      <div class="tl2"><button class="b" data-key="ArrowLeft">◀</button><button class="b" data-key="ArrowRight">▶</button></div>
      <div class="tr2"><button class="s nitro" data-key="ShiftLeft">NOS</button><button class="b gas" data-key="ArrowUp">▲</button>
        <button class="s" data-key="ArrowDown">▼</button><button class="b" data-key="Space">⟲</button></div>
      <button id="tPause">II</button>
    </div>
  </div>

  <div class="ov" id="menu">
    <div class="menuhead"><h1 id="title">Scrapyard Derby</h1><div id="langs"></div></div>
    <p class="sub" id="bestLine"></p>
    <div class="grid3" id="cars"></div>
    <div id="packs"></div>
    <div class="keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / ↑←↓→: <span data-i18n="k_drive">drive</span></span>
      <span><kbd>Space</kbd> <span data-i18n="k_hb">handbrake</span></span>
      <span><kbd>Shift</kbd> <span data-i18n="k_nitro">nitro</span></span>
      <span><kbd>P</kbd> <span data-i18n="k_pause">pause</span></span>
      <span data-i18n="k_tip"></span>
    </div>
  </div>

  <div class="ov hide" id="shop">
    <div class="shophead"><h2 id="shopTitle">Garage</h2><span class="scrapct" id="shopScrap">0</span></div>
    <div class="garage">
      <section class="col">
        <div class="lbl" data-i18n="forSale">For sale</div>
        <div id="cards"></div>
        <p class="hint" id="lockHint"></p>
      </section>
      <section class="col bp"><div class="lbl" data-i18n="blueprint" style="color:var(--bp)">Blueprint</div><div id="blueprint"></div></section>
      <section class="panel" id="build"></section>
    </div>
    <div class="gfoot row"><button class="btn" id="go" data-i18n="next">Next lap</button><button class="btn alt" id="reroll">Reroll</button><button class="btn alt" id="repair">Repair</button></div>
  </div>

  <div class="ov hide center" id="over">
    <p class="wrecked" id="wreckedTxt">Wrecked</p>
    <p class="sub" id="overStats"></p>
    <div class="row" style="justify-content:center"><button class="btn" id="again" data-i18n="back">Back to the pits</button></div>
  </div>

  <div class="ov hide center" id="pause">
    <h2 data-i18n="paused">Paused</h2>
    <div class="row" style="justify-content:center"><button class="btn" id="resume" data-i18n="resume">Resume</button></div>
  </div>

  <div id="loading">
    <div class="ld">
      <img class="lg" id="loadLogo" alt="" hidden>
      <div class="tyre" aria-hidden="true"></div>
      <div id="loadMsg">Warming up the engines…</div>
      <div class="track"><i id="loadBar"></i></div>
      <div id="loadPct">0%</div>
      <p id="loadTip"></p>
    </div>
  </div>
</div>
<noscript>Scrapyard Derby needs JavaScript and WebGL.</noscript>
<script>
  // show the right logo on the loading screen straight away, before the game code arrives
  { let l = 'en'; try { l = localStorage.getItem('scrapyard-lang') || (navigator.language || 'en').slice(0, 2) } catch (e) { }
    if (l === 'nl') l = 'vls';
    const img = document.getElementById('loadLogo');
    img.onload = () => { img.hidden = false };
    img.onerror = () => { if (!img.src.endsWith('/logo.png')) img.src = 'assets/logo.png' };
    img.src = l === 'en' ? 'assets/logo.png' : 'assets/logo-' + l + '.png'; }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
